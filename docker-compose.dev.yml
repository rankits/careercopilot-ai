services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: career_copilot_pg_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-careercopilot_dev}
    ports:
      - '5432:5432'
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-careercopilot_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: career_copilot_redis_dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: career_copilot_rabbitmq_dev
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    container_name: career_copilot_backend_dev
    restart: unless-stopped
    ports:
      - '5001:5001'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      NODE_ENV: '${NODE_ENV:-development}'
      PORT: '${PORT:-5001}'
      BASE_URL: '${BASE_URL:-http://backend:5001}'
      DATABASE_URL: '${DATABASE_URL:-postgresql://postgres:postgres_password@postgres:5432/careercopilot_dev?schema=public}'
      RUN_MIGRATIONS: '${RUN_MIGRATIONS:-true}'
      JWT_ACCESS_SECRET: '${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production}'
      JWT_REFRESH_SECRET: '${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production}'
      CACHE_DRIVER: '${CACHE_DRIVER:-redis}'
      REDIS_MODE: '${REDIS_MODE:-standalone}'
      REDIS_HOST: '${REDIS_HOST:-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      REDIS_KEY_PREFIX: '${REDIS_KEY_PREFIX:-careercopilot:}'
      RABBITMQ_URL: '${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}'
      LOGGING_ENABLED: '${LOGGING_ENABLED:-true}'
      LOG_PRETTY: '${LOG_PRETTY:-true}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      CORS_ORIGIN: '${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}'
      RESUME_STORAGE_DRIVER: '${RESUME_STORAGE_DRIVER:-LOCAL}'
      RESUME_MAX_FILE_SIZE_MB: '${RESUME_MAX_FILE_SIZE_MB:-10}'
      RESUME_LOCAL_STORAGE_DIR: '${RESUME_LOCAL_STORAGE_DIR:-/app/storage/resumes}'
      PARSER_ENGINE: '${PARSER_ENGINE:-RULE_BASED}'
      AI_RESUME_PARSER_PROVIDER: '${AI_RESUME_PARSER_PROVIDER:-google}'
      AI_RESUME_PARSER_MODEL: '${AI_RESUME_PARSER_MODEL:-gemini-2.0-flash}'
      AI_RESUME_PARSER_TEMPERATURE: '${AI_RESUME_PARSER_TEMPERATURE:-0}'
      AI_RESUME_PARSER_MAX_RETRIES: '${AI_RESUME_PARSER_MAX_RETRIES:-2}'
      AI_RESUME_ANALYSIS_PROVIDER: '${AI_RESUME_ANALYSIS_PROVIDER:-openrouter}'
      AI_RESUME_ANALYSIS_MODEL: '${AI_RESUME_ANALYSIS_MODEL:-google/gemini-2.5-flash}'
      AI_RESUME_ANALYSIS_FALLBACK_MODELS: '${AI_RESUME_ANALYSIS_FALLBACK_MODELS:-google/gemini-2.0-flash-exp:free,google/gemma-3-27b-it:free,google/gemma-4-26b-a4b-it:free}'
      AI_RESUME_ANALYSIS_MAX_TOKENS: '${AI_RESUME_ANALYSIS_MAX_TOKENS:-2800}'
      AI_RESUME_ANALYSIS_TIMEOUT_MS: '${AI_RESUME_ANALYSIS_TIMEOUT_MS:-90000}'
      AI_RESUME_ANALYSIS_FREE_TIMEOUT_MS: '${AI_RESUME_ANALYSIS_FREE_TIMEOUT_MS:-35000}'
      AI_RESUME_ANALYSIS_FALLBACK_PROVIDERS: '${AI_RESUME_ANALYSIS_FALLBACK_PROVIDERS:-groq}'
      AI_RESUME_ANALYSIS_GROQ_MODEL: '${AI_RESUME_ANALYSIS_GROQ_MODEL:-llama-3.1-8b-instant}'
      AI_EMBEDDING_PROVIDER: '${AI_EMBEDDING_PROVIDER:-}'
      AI_EMBEDDING_MODEL: '${AI_EMBEDDING_MODEL:-}'
      AI_EMBEDDING_DIMENSIONS: '${AI_EMBEDDING_DIMENSIONS:-768}'
      AI_EMBEDDING_REQUEST_DIMENSIONS: '${AI_EMBEDDING_REQUEST_DIMENSIONS:-}'
      AI_EMBEDDING_TIMEOUT_MS: '${AI_EMBEDDING_TIMEOUT_MS:-30000}'
      AI_EMBEDDING_BATCH_SIZE: '${AI_EMBEDDING_BATCH_SIZE:-32}'
      AI_EMBEDDING_BATCH_MAX_CHARACTERS: '${AI_EMBEDDING_BATCH_MAX_CHARACTERS:-200000}'
      AI_EMBEDDING_DOCUMENT_PREFIX: '${AI_EMBEDDING_DOCUMENT_PREFIX:-}'
      AI_EMBEDDING_QUERY_PREFIX: '${AI_EMBEDDING_QUERY_PREFIX:-}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      OPENROUTER_BASE_URL: '${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}'
      OPENROUTER_HTTP_REFERER: '${OPENROUTER_HTTP_REFERER:-}'
      OPENROUTER_APP_TITLE: '${OPENROUTER_APP_TITLE:-Career Copilot}'
      OPENROUTER_APP_NAME: '${OPENROUTER_APP_NAME:-Career Copilot}'
      OPENROUTER_ALLOW_FALLBACKS: '${OPENROUTER_ALLOW_FALLBACKS:-}'
      OPENROUTER_RECOMMENDATION_API_KEY: '${OPENROUTER_RECOMMENDATION_API_KEY:-}'
      OPENROUTER_RECOMMENDATION_BASE_URL: '${OPENROUTER_RECOMMENDATION_BASE_URL:-}'
      OPENROUTER_RECOMMENDATION_HTTP_REFERER: '${OPENROUTER_RECOMMENDATION_HTTP_REFERER:-}'
      OPENROUTER_RECOMMENDATION_APP_TITLE: '${OPENROUTER_RECOMMENDATION_APP_TITLE:-}'
      OPENROUTER_RECOMMENDATION_ALLOW_FALLBACKS: '${OPENROUTER_RECOMMENDATION_ALLOW_FALLBACKS:-}'
      OPENROUTER_RECOMMENDATION_PROVIDER_ORDER: '${OPENROUTER_RECOMMENDATION_PROVIDER_ORDER:-}'
      OPENROUTER_RECOMMENDATION_DATA_COLLECTION_POLICY: '${OPENROUTER_RECOMMENDATION_DATA_COLLECTION_POLICY:-}'
      OPENROUTER_MODEL: '${OPENROUTER_MODEL:-}'
      OPENROUTER_FALLBACK_MODELS: '${OPENROUTER_FALLBACK_MODELS:-}'
      OPENROUTER_STRUCTURED_OUTPUT_ENABLED: '${OPENROUTER_STRUCTURED_OUTPUT_ENABLED:-true}'
      OPENROUTER_FREE_ROUTER_ALLOWED: '${OPENROUTER_FREE_ROUTER_ALLOWED:-true}'
      OPENROUTER_TIMEOUT_MS: '${OPENROUTER_TIMEOUT_MS:-60000}'
      AI_PROVIDER: '${AI_PROVIDER:-fake}'
      AI_MAIL_ENABLED: '${AI_MAIL_ENABLED:-false}'
      AI_MAIL_TEMPERATURE: '${AI_MAIL_TEMPERATURE:-0.4}'
      AI_MAIL_MAX_OUTPUT_TOKENS: '${AI_MAIL_MAX_OUTPUT_TOKENS:-1200}'
      AI_MAIL_TIMEOUT_MS: '${AI_MAIL_TIMEOUT_MS:-45000}'
      AI_MAIL_MAX_RETRIES: '${AI_MAIL_MAX_RETRIES:-2}'
      AI_MAIL_PROMPT_VERSION: '${AI_MAIL_PROMPT_VERSION:-v1}'
      AI_MAIL_OUTPUT_SCHEMA_VERSION: '${AI_MAIL_OUTPUT_SCHEMA_VERSION:-v1}'
      AI_MAIL_FAKE_MODE: '${AI_MAIL_FAKE_MODE:-success}'
      GOOGLE_API_KEY: '${GOOGLE_API_KEY:-}'
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GOOGLE_EMBEDDING_BASE_URL: '${GOOGLE_EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}'
      GROQ_API_KEY: '${GROQ_API_KEY:-}'
      GROQ_API_KEY_2: '${GROQ_API_KEY_2:-}'
      GROQ_API_KEYS: '${GROQ_API_KEYS:-}'
      GROQ_EMBEDDING_BASE_URL: '${GROQ_EMBEDDING_BASE_URL:-https://api.groq.com/openai/v1}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      # Sign-in-with-Google (identity login) + Connected Accounts (mailbox OAuth)
      GOOGLE_LOGIN_ENABLED: '${GOOGLE_LOGIN_ENABLED:-false}'
      GOOGLE_LOGIN_REDIRECT_URI: '${GOOGLE_LOGIN_REDIRECT_URI:-http://localhost:3000/auth/google/callback}'
      GOOGLE_LOGIN_SCOPES: '${GOOGLE_LOGIN_SCOPES:-openid,email,profile}'
      GOOGLE_GMAIL_ENABLED: '${GOOGLE_GMAIL_ENABLED:-false}'
      GOOGLE_GMAIL_SEND_ENABLED: '${GOOGLE_GMAIL_SEND_ENABLED:-false}'
      GMAIL_INTEGRATION_ENABLED: '${GMAIL_INTEGRATION_ENABLED:-false}'
      MAIL_SENDING_ENABLED: '${MAIL_SENDING_ENABLED:-false}'
      MAIL_SENDS_PER_USER_PER_HOUR: '${MAIL_SENDS_PER_USER_PER_HOUR:-10}'
      MAIL_SENDS_PER_USER_PER_DAY: '${MAIL_SENDS_PER_USER_PER_DAY:-30}'
      AI_MAIL_RECIPIENT_HMAC_SECRET: '${AI_MAIL_RECIPIENT_HMAC_SECRET:-}'
      AI_MAIL_MIN_FOLLOW_UP_INTERVAL_HOURS: '${AI_MAIL_MIN_FOLLOW_UP_INTERVAL_HOURS:-72}'
      GOOGLE_OAUTH_CLIENT_ID: '${GOOGLE_OAUTH_CLIENT_ID:-}'
      GOOGLE_OAUTH_CLIENT_SECRET: '${GOOGLE_OAUTH_CLIENT_SECRET:-}'
      GOOGLE_OAUTH_REDIRECT_URI: '${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/settings/connected-accounts/google/result}'
      GOOGLE_OAUTH_SCOPES: '${GOOGLE_OAUTH_SCOPES:-openid,email,profile,https://www.googleapis.com/auth/gmail.send}'
      GOOGLE_OAUTH_ACCESS_TYPE: '${GOOGLE_OAUTH_ACCESS_TYPE:-offline}'
      GOOGLE_OAUTH_INCLUDE_GRANTED_SCOPES: '${GOOGLE_OAUTH_INCLUDE_GRANTED_SCOPES:-true}'
      GOOGLE_OAUTH_PROMPT: '${GOOGLE_OAUTH_PROMPT:-consent}'
      GOOGLE_TOKEN_ENCRYPTION_KEY: '${GOOGLE_TOKEN_ENCRYPTION_KEY:-}'
      GOOGLE_OAUTH_STATE_SIGNING_KEY: '${GOOGLE_OAUTH_STATE_SIGNING_KEY:-}'
      GOOGLE_OAUTH_STATE_TTL_SECONDS: '${GOOGLE_OAUTH_STATE_TTL_SECONDS:-600}'
      GOOGLE_OAUTH_SUCCESS_REDIRECT_URL: '${GOOGLE_OAUTH_SUCCESS_REDIRECT_URL:-http://localhost:3000/settings/connected-accounts}'
      GOOGLE_OAUTH_FAILURE_REDIRECT_URL: '${GOOGLE_OAUTH_FAILURE_REDIRECT_URL:-http://localhost:3000/settings/connected-accounts}'
      AWS_REGION: '${AWS_REGION:-us-east-1}'
      RESUME_S3_PREFIX: '${RESUME_S3_PREFIX:-users}'
      JOB_STORAGE_AGE_FILTER_ENABLED: '${JOB_STORAGE_AGE_FILTER_ENABLED:-true}'
      JOB_STORAGE_MAX_AGE_DAYS: '${JOB_STORAGE_MAX_AGE_DAYS:-90}'
      JOB_EMBEDDING_AGE_FILTER_ENABLED: '${JOB_EMBEDDING_AGE_FILTER_ENABLED:-true}'
      JOB_EMBEDDING_MAX_AGE_DAYS: '${JOB_EMBEDDING_MAX_AGE_DAYS:-5}'
      JOB_UNKNOWN_DATE_POLICY: '${JOB_UNKNOWN_DATE_POLICY:-ALLOW_STORAGE_ONLY}'
      JOB_STORAGE_EXPIRED_ACTION: '${JOB_STORAGE_EXPIRED_ACTION:-EXPIRE}'
      JOB_REMOVE_OUTDATED_EMBEDDINGS: '${JOB_REMOVE_OUTDATED_EMBEDDINGS:-true}'
      JOB_INGESTION_ON_STARTUP_ENABLED: '${JOB_INGESTION_ON_STARTUP_ENABLED:-false}'
      JOB_INGESTION_ON_STARTUP_DELAY_MS: '${JOB_INGESTION_ON_STARTUP_DELAY_MS:-5000}'
      JOB_INGESTION_ON_STARTUP_FAIL_APPLICATION: '${JOB_INGESTION_ON_STARTUP_FAIL_APPLICATION:-false}'
      JOB_INGESTION_ON_STARTUP_LOCK_TTL_SECONDS: '${JOB_INGESTION_ON_STARTUP_LOCK_TTL_SECONDS:-1800}'
      JOB_INGESTION_ON_STARTUP_PROVIDERS: '${JOB_INGESTION_ON_STARTUP_PROVIDERS:-}'
      JOB_INGESTION_ON_STARTUP_ALLOWED_TIERS: '${JOB_INGESTION_ON_STARTUP_ALLOWED_TIERS:-}'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_dev_storage:/app/storage/resumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  outbox-relay:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    container_name: career_copilot_outbox_relay_dev
    restart: unless-stopped
    command: npm run worker:outbox
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      DATABASE_URL: '${DATABASE_URL:-postgresql://postgres:postgres_password@postgres:5432/careercopilot_dev?schema=public}'
      RABBITMQ_URL: '${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}'
      RUN_MIGRATIONS: 'false'
      OUTBOX_BATCH_SIZE: '${OUTBOX_BATCH_SIZE:-50}'
      OUTBOX_MAX_ATTEMPTS: '${OUTBOX_MAX_ATTEMPTS:-10}'
      OUTBOX_LOCK_TIMEOUT_MS: '${OUTBOX_LOCK_TIMEOUT_MS:-60000}'
      OUTBOX_POLL_INTERVAL_MS: '${OUTBOX_POLL_INTERVAL_MS:-1000}'
      OUTBOX_RETRY_BASE_DELAY_MS: '${OUTBOX_RETRY_BASE_DELAY_MS:-5000}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  application-submission-worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    container_name: career_copilot_application_submission_worker_dev
    restart: unless-stopped
    # Exceeds APPLICATION_SUBMISSION_WORKER_DRAIN_TIMEOUT_MS default (30s) so SIGTERM drain can finish (AA-008).
    stop_grace_period: 45s
    command: npm run worker:application-submission
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      DATABASE_URL: '${DATABASE_URL:-postgresql://postgres:postgres_password@postgres:5432/careercopilot_dev?schema=public}'
      RABBITMQ_URL: '${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}'
      RUN_MIGRATIONS: 'false'
      ENABLE_AUTO_APPLY: '${ENABLE_AUTO_APPLY:-true}'
      ENABLE_AUTO_APPLY_HEADLESS_SNAPSHOT: '${ENABLE_AUTO_APPLY_HEADLESS_SNAPSHOT:-true}'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: '${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-/usr/bin/chromium}'
      CHROMIUM_PATH: '${CHROMIUM_PATH:-/usr/bin/chromium}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true

  job-embedding-worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    profiles:
      - embeddings
    container_name: career_copilot_job_embedding_worker_dev
    restart: unless-stopped
    command: npm run worker:job-embeddings
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      DATABASE_URL: '${DATABASE_URL:-postgresql://postgres:postgres_password@postgres:5432/careercopilot_dev?schema=public}'
      RABBITMQ_URL: '${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}'
      RUN_MIGRATIONS: 'false'
      AI_EMBEDDING_PROVIDER: '${AI_EMBEDDING_PROVIDER:-}'
      AI_EMBEDDING_MODEL: '${AI_EMBEDDING_MODEL:-}'
      AI_EMBEDDING_DIMENSIONS: '${AI_EMBEDDING_DIMENSIONS:-768}'
      AI_EMBEDDING_REQUEST_DIMENSIONS: '${AI_EMBEDDING_REQUEST_DIMENSIONS:-}'
      AI_EMBEDDING_TIMEOUT_MS: '${AI_EMBEDDING_TIMEOUT_MS:-30000}'
      AI_EMBEDDING_BATCH_SIZE: '${AI_EMBEDDING_BATCH_SIZE:-32}'
      AI_EMBEDDING_BATCH_MAX_CHARACTERS: '${AI_EMBEDDING_BATCH_MAX_CHARACTERS:-200000}'
      AI_EMBEDDING_DOCUMENT_PREFIX: '${AI_EMBEDDING_DOCUMENT_PREFIX:-}'
      AI_EMBEDDING_QUERY_PREFIX: '${AI_EMBEDDING_QUERY_PREFIX:-}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      OPENROUTER_BASE_URL: '${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}'
      OPENROUTER_HTTP_REFERER: '${OPENROUTER_HTTP_REFERER:-}'
      OPENROUTER_APP_TITLE: '${OPENROUTER_APP_TITLE:-Career Copilot}'
      OPENROUTER_ALLOW_FALLBACKS: '${OPENROUTER_ALLOW_FALLBACKS:-}'
      GOOGLE_API_KEY: '${GOOGLE_API_KEY:-}'
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GOOGLE_EMBEDDING_BASE_URL: '${GOOGLE_EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}'
      GROQ_API_KEY: '${GROQ_API_KEY:-}'
      GROQ_EMBEDDING_BASE_URL: '${GROQ_EMBEDDING_BASE_URL:-https://api.groq.com/openai/v1}'
      JOB_EMBEDDING_DOCUMENT_SCHEMA_VERSION: '${JOB_EMBEDDING_DOCUMENT_SCHEMA_VERSION:-1}'
      JOB_STORAGE_AGE_FILTER_ENABLED: '${JOB_STORAGE_AGE_FILTER_ENABLED:-true}'
      JOB_STORAGE_MAX_AGE_DAYS: '${JOB_STORAGE_MAX_AGE_DAYS:-90}'
      JOB_EMBEDDING_AGE_FILTER_ENABLED: '${JOB_EMBEDDING_AGE_FILTER_ENABLED:-true}'
      JOB_EMBEDDING_MAX_AGE_DAYS: '${JOB_EMBEDDING_MAX_AGE_DAYS:-5}'
      JOB_UNKNOWN_DATE_POLICY: '${JOB_UNKNOWN_DATE_POLICY:-ALLOW_STORAGE_ONLY}'
      JOB_REMOVE_OUTDATED_EMBEDDINGS: '${JOB_REMOVE_OUTDATED_EMBEDDINGS:-true}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.dev
    profiles:
      - frontend
    container_name: career_copilot_frontend_dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      VITE_API_BASE_URL: '/api/v1'
      VITE_APP_NAME: CareerCopilot
      VITE_DEV_PROXY_TARGET: 'http://backend:5001'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_dev_data:
  redis_dev_data:
  rabbitmq_dev_data:
  backend_dev_storage:
