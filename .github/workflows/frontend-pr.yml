name: Frontend Pull Request CI

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 'Frontend / Format Check'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  lint:
    name: 'Frontend / Lint'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: 'Frontend / Type Check'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npm run typecheck

  unit-tests:
    name: 'Frontend / Unit Tests'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit/component tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  build:
    name: 'Frontend / Production Build'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Upload build artifact for analysis
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  bundle-analysis:
    name: 'Frontend / Bundle Analysis'
    needs: build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Analyze Bundle Size
        run: |
          echo "--- Bundle Size Analysis ---"
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          echo "Top Largest Assets:"
          find dist -type f -exec ls -lh {} + | awk '{print $5, $9}' | sort -hr | head -n 15
          TOTAL_SIZE=$(du -sh dist | cut -f1)
          FILE_COUNT=$(find dist -type f | wc -l)
          echo "Total Generated Assets: $FILE_COUNT files"
          echo "Total Bundle Size: $TOTAL_SIZE"

  accessibility:
    name: 'Frontend / Accessibility'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Accessibility DOM and attributes
        run: |
          echo "Checking for basic semantic structure and aria attributes..."
          npm run test -- --run

  e2e-smoke:
    name: 'Frontend / E2E Smoke'
    runs-on: self-hosted
    # Self-hosted runner user has no sudo, so `playwright install --with-deps`
    # (which shells out to apt-get) always fails. Run inside the official
    # Playwright image instead — it ships the matching browsers and OS
    # dependencies preinstalled, so no privilege escalation is needed.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run Playwright smoke tests
        run: npm run test:e2e

  security:
    name: 'Frontend / Security Scan'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm security audit
        run: npm audit --audit-level=critical

  quality-gate:
    name: 'Frontend / Quality Gate'
    needs:
      - format
      - lint
      - typecheck
      - unit-tests
      - build
      - bundle-analysis
      - accessibility
      - e2e-smoke
      - security
    runs-on: self-hosted
    if: always()
    steps:
      - name: Evaluate Quality Gate
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.bundle-analysis.result }}" != "success" ] || \
             [ "${{ needs.accessibility.result }}" != "success" ] || \
             [ "${{ needs.e2e-smoke.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "Quality gate failed: One or more required validation jobs did not succeed."
            exit 1
          fi
          echo "All frontend PR validation checks passed successfully!"
