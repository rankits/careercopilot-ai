name: Deploy Frontend to AWS

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Frontend Before Deployment
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    # Self-hosted runner user has no sudo, so `playwright install --with-deps`
    # (which shells out to apt-get) always fails. Run inside the official
    # Playwright image instead, it ships the matching browsers and OS
    # dependencies preinstalled, so no privilege escalation is needed.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compiler typecheck
        run: npm run typecheck

      - name: Run non-interactive unit tests with coverage
        run: npm run test:coverage

      - name: Validate production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E Smoke test
        run: npm run test:e2e

  deploy:
    name: Deploy Frontend to S3 & CloudFront
    needs: validate
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment variables and secrets
        run: |
          echo "Checking required GitHub Actions variables and secrets..."
          MISSING=0
          if [ -z "${{ vars.AWS_REGION }}" ]; then echo "Error: Missing variable AWS_REGION"; MISSING=1; fi
          if [ -z "${{ vars.FRONTEND_S3_BUCKET }}" ]; then echo "Error: Missing variable FRONTEND_S3_BUCKET"; MISSING=1; fi
          if [ -z "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then echo "Error: Missing variable CLOUDFRONT_DISTRIBUTION_ID"; MISSING=1; fi
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then echo "Error: Missing variable VITE_API_BASE_URL"; MISSING=1; fi
          if [ -z "${{ vars.VITE_APP_NAME }}" ]; then echo "Error: Missing variable VITE_APP_NAME"; MISSING=1; fi
          if [ -z "${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}" ]; then echo "Error: Missing secret AWS_FRONTEND_DEPLOY_ROLE_ARN"; MISSING=1; fi
          if [ "$MISSING" -eq 1 ]; then
            echo "Fatal: One or more required variables or secrets are missing. Deployment aborted."
            exit 1
          fi
          echo "All required variables and secrets are present."

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        run: npm run build

      - name: Validate build output
        id: build_validation
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Build output directory 'dist' does not exist."
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: Required entry file 'dist/index.html' was not found."
            exit 1
          fi
          FILE_COUNT=$(find dist -type f | wc -l)
          TOTAL_SIZE=$(du -sh dist | cut -f1)
          echo "Build validation successful:"
          echo "  Generated files count: $FILE_COUNT"
          echo "  Total build size: $TOTAL_SIZE"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_size=$TOTAL_SIZE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Frontend-Production

      - name: Upload commit-specific backup build to S3
        run: |
          aws s3 cp dist/ s3://${{ vars.FRONTEND_S3_BUCKET }}/releases/${{ github.sha }}/ --recursive

      - name: Sync build output to S3 production prefix (remove obsolete files)
        run: |
          aws s3 sync dist/ s3://${{ vars.FRONTEND_S3_BUCKET }} --delete --exclude "releases/*"

      - name: Upload immutable static assets with long cache lifetime
        run: |
          aws s3 cp dist/ s3://${{ vars.FRONTEND_S3_BUCKET }} \
            --recursive \
            --exclude "*" \
            --include "assets/*" \
            --include "*.js" \
            --include "*.css" \
            --include "*.woff*" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.svg" \
            --include "*.ico" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload mutable entry files with no-cache headers
        run: |
          aws s3 cp dist/ s3://${{ vars.FRONTEND_S3_BUCKET }} \
            --recursive \
            --exclude "*" \
            --include "index.html" \
            --include "config.json" \
            --include "manifest.json" \
            --include "sw.js" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Verify index.html exists in S3
        run: |
          aws s3api head-object --bucket ${{ vars.FRONTEND_S3_BUCKET }} --key index.html

      - name: Invalidate CloudFront distribution
        id: cloudfront_invalidation
        run: |
          PATHS="/index.html /"
          if [ -f "dist/config.json" ]; then
            PATHS="$PATHS /config.json"
          fi
          echo "Creating CloudFront invalidation for paths: $PATHS"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths $PATHS \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Generate deployment summary
        if: always()
        run: |
          {
            echo "# Frontend Deployment Summary"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Status:** Deployment Successful"
            else
              echo "**Status:** Deployment Failed (${{ job.status }})"
            fi
            echo ""
            echo "## Deployment Details"
            echo "- **Environment:** ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
            echo "- **Git Branch:** \`${{ github.ref_name }}\`"
            echo "- **Commit SHA:** \`${{ github.sha }}\`"
            echo "- **S3 Bucket:** \`${{ vars.FRONTEND_S3_BUCKET }}\`"
            echo "- **CloudFront Distribution ID:** \`${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- **Build Output Size:** \`${{ steps.build_validation.outputs.total_size || 'N/A' }}\` (${{ steps.build_validation.outputs.file_count || '0' }} files)"
            echo "- **CloudFront Invalidation ID:** \`${{ steps.cloudfront_invalidation.outputs.invalidation_id || 'N/A' }}\`"
            if [ -n "${{ vars.FRONTEND_PUBLIC_URL }}" ]; then
              echo "- **Frontend Public URL:** [${{ vars.FRONTEND_PUBLIC_URL }}](${{ vars.FRONTEND_PUBLIC_URL }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
