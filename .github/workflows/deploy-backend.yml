name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
      - 'deploy/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: career-copilot-backend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compiler typecheck
        run: npm run typecheck

      - name: Run automated unit tests
        run: npm test

      - name: Validate production build
        run: npm run build

  build-and-push:
    name: Build and Push Docker Image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.DOCKER_IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-deployment:
    name: Package and Upload Release Bundle
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inspect GitHub OIDC subject
        shell: bash
        run: |
          RESPONSE="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
  
          TOKEN="$(echo "$RESPONSE" | jq -r '.value')"
  
          python3 - "$TOKEN" <<'PY'
          import base64
          import json
          import sys
  
          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
  
          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )
  
          print("aud =", claims.get("aud"))
          print("sub =", claims.get("sub"))
          print("repository_id =", claims.get("repository_id"))
          print("repository_owner_id =", claims.get("repository_owner_id"))
          PY

      - name: Create release tarball bundle
        run: |
          mkdir -p bundle
          tar -czvf bundle/backend-deployment.tar.gz -C deploy/backend .
          echo "Release bundle created successfully."

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Backend-Package

      - name: Upload bundle to S3 deployment bucket
        run: |
          aws s3 cp bundle/backend-deployment.tar.gz \
            s3://${{ vars.BACKEND_DEPLOYMENT_BUCKET }}/backend/career-copilot-backend-${{ github.sha }}.tar.gz
          echo "Bundle uploaded to s3://${{ vars.BACKEND_DEPLOYMENT_BUCKET }}/backend/career-copilot-backend-${{ github.sha }}.tar.gz"

  deploy:
    name: Deploy to EC2 via AWS Systems Manager
    needs: package-deployment
    runs-on: ubuntu-latest
    # environment:
    #   name: production

    steps:
      - name: Trigger atomic EC2 deployment via SSM Run Command
        id: ssm_deploy
        run: |
          cat <<'EOF' > deploy-command.sh
          set -Eeuo pipefail
      
          SHA="${{ github.sha }}"
          RELEASE_DIR="/opt/career-copilot/backend/releases/$SHA"
          BUNDLE="/tmp/career-copilot-backend-$SHA.tar.gz"
          S3_URI="s3://${{ vars.BACKEND_DEPLOYMENT_BUCKET }}/backend/career-copilot-backend-$SHA.tar.gz"
          IMAGE="${{ vars.DOCKER_IMAGE_NAME }}:$SHA"
      
          mkdir -p "$RELEASE_DIR"
      
          aws s3 cp "$S3_URI" "$BUNDLE"
      
          tar -xzvf "$BUNDLE" -C "$RELEASE_DIR"
          rm -f "$BUNDLE"
      
          chmod +x "$RELEASE_DIR"/*.sh
      
          "$RELEASE_DIR/install-release.sh" "$IMAGE" "$SHA"
          EOF
      
          SCRIPT_B64=$(base64 -w 0 deploy-command.sh)
      
          cat <<EOF > ssm-params.json
          {
            "commands": [
              "echo '$SCRIPT_B64' | base64 -d > /tmp/career-copilot-deploy.sh",
              "chmod +x /tmp/career-copilot-deploy.sh",
              "/bin/bash /tmp/career-copilot-deploy.sh",
              "rm -f /tmp/career-copilot-deploy.sh"
            ]
          }
          EOF
      
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --comment "Deploy Career Copilot Backend SHA ${{ github.sha }}" \
            --parameters file://ssm-params.json \
            --output text \
            --query "Command.CommandId")
      
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM Command Completion
        run: |
          COMMAND_ID="${{ steps.ssm_deploy.outputs.command_id }}"
          echo "Waiting for SSM Command ID: $COMMAND_ID..."
          STATUS="InProgress"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: Status = $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 5
          done

          echo "Final SSM Command Status: $STATUS"

          echo "--- Standard Output ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text || true

          echo "--- Standard Error ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Error: SSM deployment command failed with status: $STATUS"
            exit 1
          fi

  verify-public-endpoint:
    name: Verify Public Health Endpoint
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify Public Health Endpoint
        run: |
          HEALTH_URL="${{ vars.BACKEND_PUBLIC_HEALTH_URL }}"
          echo "Verifying public health endpoint at $HEALTH_URL..."
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt $attempt/$MAX_ATTEMPTS: Checking $HEALTH_URL..."
            RESPONSE="$(curl -s -w "\n%{http_code}" "$HEALTH_URL" 2>/dev/null || echo -e "\n000")"
            HTTP_CODE="$(echo "$RESPONSE" | tail -n 1)"
            BODY="$(echo "$RESPONSE" | sed '$d')"

            if [ "$HTTP_CODE" = "200" ]; then
              if echo "$BODY" | grep -E -q '"status"\s*:\s*"ok"'; then
                echo "Public endpoint health verification passed! Response: $BODY"
                exit 0
              else
                echo "Warning: HTTP 200 received but status not ok: $BODY"
              fi
            else
              echo "Warning: Received HTTP $HTTP_CODE"
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Error: Public health verification failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Generate Deployment Step Summary
        if: always()
        run: |
          {
            echo "# Backend Deployment Summary"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Status:**  Deployment Successful"
            else
              echo "**Status:**  Deployment Failed (${{ job.status }})"
            fi
            echo ""
            echo "## Deployment Details"
            echo "- **Environment:** production"
            echo "- **Git Branch:** \`${{ github.ref_name }}\`"
            echo "- **Commit SHA:** \`${{ github.sha }}\`"
            echo "- **Docker Image:** \`${{ vars.DOCKER_IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- **EC2 Instance ID:** \`${{ vars.EC2_INSTANCE_ID }}\`"
            echo "- **S3 Bundle:** \`s3://${{ vars.BACKEND_DEPLOYMENT_BUCKET }}/backend/career-copilot-backend-${{ github.sha }}.tar.gz\`"
            echo "- **Public Health URL:** [${{ vars.BACKEND_PUBLIC_HEALTH_URL }}](${{ vars.BACKEND_PUBLIC_HEALTH_URL }})"
          } >> "$GITHUB_STEP_SUMMARY"
