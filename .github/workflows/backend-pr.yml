name: Backend Pull Request CI

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'backend/**'
      - 'deploy/backend/**'
      - '.github/workflows/backend-*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 'Backend / Format Check'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  lint:
    name: 'Backend / Lint'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: 'Backend / Type Check'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npm run typecheck

  unit-tests:
    name: 'Backend / Unit Tests'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-coverage
          path: backend/coverage
          if-no-files-found: ignore

  integration-tests:
    name: 'Backend / Integration Tests'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests
        run: npm run test:integration

  build:
    name: 'Backend / Production Build'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate production TypeScript build
        run: npm run build

  docker-build:
    name: 'Backend / Docker Build'
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          # Dockerfile.prod's COPY paths (docker/entrypoint.sh, prisma, package*.json)
          # are relative to backend/, matching docker-compose.dev.yml's convention.
          # A repo-root context makes those COPY sources resolve to the wrong files.
          # Note: `file` is resolved relative to the repo root, not `context`.
          context: ./backend
          file: ./backend/docker/Dockerfile.prod
          platforms: linux/amd64
          push: false
          tags: career-copilot-backend:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-config-validation:
    name: 'Backend / Deploy Config Validation'
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate deployment shell scripts syntax
        run: bash -n deploy/backend/*.sh
      - name: Validate Docker Compose config
        # compose.yaml's services default `env_file` to the production host path
        # /opt/career-copilot/backend/shared/.env (populated once on the EC2 box
        # by deploy.sh). That path doesn't exist on CI runners, so point
        # SHARED_ENV_FILE at the checked-out example file for this validation
        # only — it's resolved relative to compose.yaml's directory.
        run: |
          export SHARED_ENV_FILE=.env.example
          docker compose \
            --env-file deploy/backend/.env.example \
            -f deploy/backend/compose.yaml \
            config

  security:
    name: 'Backend / Security Scan'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm security audit
        run: npm audit --audit-level=high

  quality-gate:
    name: 'Backend / Quality Gate'
    needs:
      - format
      - lint
      - typecheck
      - unit-tests
      - integration-tests
      - build
      - docker-build
      - deploy-config-validation
      - security
    runs-on: self-hosted
    if: always()
    steps:
      - name: Evaluate Quality Gate
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ] || \
             [ "${{ needs.deploy-config-validation.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "Quality gate failed: One or more required validation jobs did not succeed."
            exit 1
          fi
          echo "All backend PR validation checks passed successfully!"
