name: Deploy Frontend to AWS

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run non-interactive unit tests
        run: npm test

      - name: Validate production build
        run: npm run build

  deploy:
    name: Deploy Frontend to Production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC subject
        shell: bash
        run: |
          RESPONSE="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(echo "$RESPONSE" | jq -r '.value')"

          python3 - "$TOKEN" <<'PY'
          import base64
          import json
          import sys

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )

          print("aud =", claims.get("aud"))
          print("sub =", claims.get("sub"))
          print("repository_id =", claims.get("repository_id"))
          print("repository_owner_id =", claims.get("repository_owner_id"))
          PY

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment variables and secrets
        run: |
          echo "Checking required GitHub Actions variables and secrets..."
          MISSING=0
          if [ -z "${{ vars.AWS_REGION }}" ]; then echo "Error: Missing variable AWS_REGION"; MISSING=1; fi
          if [ -z "${{ vars.FRONTEND_S3_BUCKET }}" ]; then echo "Error: Missing variable FRONTEND_S3_BUCKET"; MISSING=1; fi
          if [ -z "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then echo "Error: Missing variable CLOUDFRONT_DISTRIBUTION_ID"; MISSING=1; fi
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then echo "Error: Missing variable VITE_API_BASE_URL"; MISSING=1; fi
          if [ -z "${{ vars.VITE_APP_NAME }}" ]; then echo "Error: Missing variable VITE_APP_NAME"; MISSING=1; fi
          if [ -z "${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}" ]; then echo "Error: Missing secret AWS_FRONTEND_DEPLOY_ROLE_ARN"; MISSING=1; fi
          if [ "$MISSING" -eq 1 ]; then
            echo "Fatal: One or more required variables or secrets are missing. Deployment aborted."
            exit 1
          fi
          echo "All required variables and secrets are present."

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        run: npm run build

      - name: Validate build output
        id: build_validation
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Build output directory 'dist' does not exist."
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: Required entry file 'dist/index.html' was not found."
            exit 1
          fi
          FILE_COUNT=$(find dist -type f | wc -l)
          TOTAL_SIZE=$(du -sh dist | cut -f1)
          echo "Build validation successful:"
          echo "  Generated files count: $FILE_COUNT"
          echo "  Total build size: $TOTAL_SIZE"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_size=$TOTAL_SIZE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Frontend-Production

      - name: Sync build output to S3 (remove obsolete files)
        run: |
          aws s3 sync dist/ s3://${{ vars.FRONTEND_S3_BUCKET }} --delete

      - name: Upload immutable static assets with long cache lifetime
        run: |
          aws s3 cp dist/ s3://${{ vars.FRONTEND_S3_BUCKET }} \
            --recursive \
            --exclude "*" \
            --include "assets/*" \
            --include "*.js" \
            --include "*.css" \
            --include "*.woff*" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.svg" \
            --include "*.ico" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload mutable entry files with no-cache headers
        run: |
          aws s3 cp dist/ s3://${{ vars.FRONTEND_S3_BUCKET }} \
            --recursive \
            --exclude "*" \
            --include "index.html" \
            --include "config.json" \
            --include "manifest.json" \
            --include "sw.js" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Verify index.html exists in S3
        run: |
          aws s3api head-object --bucket ${{ vars.FRONTEND_S3_BUCKET }} --key index.html

      - name: Invalidate CloudFront distribution
        id: cloudfront_invalidation
        run: |
          PATHS="/index.html /"
          if [ -f "dist/config.json" ]; then
            PATHS="$PATHS /config.json"
          fi
          echo "Creating CloudFront invalidation for paths: $PATHS"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths $PATHS \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Generate deployment summary
        if: always()
        run: |
          {
            echo "# Frontend Deployment Summary"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Status:** Deployment Successful"
            else
              echo " **Status:** Deployment Failed (${{ job.status }})"
            fi
            echo ""
            echo "##  Deployment Details"
            echo "- **Environment:** production"
            echo "- **Git Branch:** \`${{ github.ref_name }}\`"
            echo "- **Commit SHA:** \`${{ github.sha }}\`"
            echo "- **S3 Bucket:** \`${{ vars.FRONTEND_S3_BUCKET }}\`"
            echo "- **CloudFront Distribution ID:** \`${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- **Build Output Size:** \`${{ steps.build_validation.outputs.total_size || 'N/A' }}\` (${{ steps.build_validation.outputs.file_count || '0' }} files)"
            echo "- **CloudFront Invalidation ID:** \`${{ steps.cloudfront_invalidation.outputs.invalidation_id || 'N/A' }}\`"
            if [ -n "${{ vars.FRONTEND_PUBLIC_URL }}" ]; then
              echo "- **Frontend Public URL:** [${{ vars.FRONTEND_PUBLIC_URL }}](${{ vars.FRONTEND_PUBLIC_URL }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
