# Production Docker Compose for Career Copilot Backend
# Only includes API container and required Outbox Relay worker.
# Redis, RabbitMQ, and PostgreSQL run externally via private networking.

services:
  api:
    image: ${BACKEND_IMAGE}
    command: ['node', 'dist/server.js']
    env_file:
      - ${SHARED_ENV_FILE:-/opt/career-copilot/backend/shared/.env}
    environment:
      NODE_ENV: production
      PORT: 5001
      RUN_MIGRATIONS: 'false'
      RUN_SEEDS_ON_STARTUP: 'false'
      JOB_INGESTION_ON_STARTUP_ENABLED: 'false'
    ports:
      - '127.0.0.1:5001:5001'
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5001/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  outbox-relay:
    image: ${BACKEND_IMAGE}
    command: ['node', 'dist/workers/run-outbox-relay.js']
    env_file:
      - ${SHARED_ENV_FILE:-/opt/career-copilot/backend/shared/.env}
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: 'false'
      RUN_SEEDS_ON_STARTUP: 'false'
    restart: unless-stopped
    mem_limit: 160m
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
